<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchères en cours — Kriee</title>
<meta name="description" content="Recherche parmi les bateaux et équipements nautiques actuellement aux enchères dans le Sud de la France, par univers, région ou proximité.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .region-row { display: flex; gap: 0.7rem; padding: 0 2rem 1rem; flex-wrap: wrap; align-items: center; }
  .region-row select {
    padding: 0.55rem 0.8rem; border: 1px solid #C9C2B2; border-radius: var(--radius);
    font-family: var(--font-data); font-size: 0.8rem; background: var(--foam); color: var(--ink);
  }
  #proximity-btn { display: inline-flex; align-items: center; gap: 0.4rem; }
  #proximity-status { font-size: 0.78rem; color: #5A6772; }
  .lot-card__distance {
    font-family: var(--font-data); font-size: 0.7rem; color: var(--mistral);
    display: block; margin-top: 0.2rem;
  }
</style>
</head>
<body>

<div class="ticker" aria-label="Lots qui clôturent bientôt">
  <div class="ticker__track" id="ticker-track"></div>
</div>

<header class="site-header">
  <a href="index.html" class="brand">
    <svg class="brand__mark" width="24" height="26" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="5" y1="1" x2="5" y2="25" stroke="#0E2233" stroke-width="2"/>
      <path d="M5 3 L21 8.5 L5 14 Z" fill="#C7401F"/>
    </svg>
    <span class="brand__word">Kri<span style="color:var(--buoy)">ee</span></span>
    <span class="brand__sub">SUD DE LA FRANCE</span>
  </a>
  <nav class="site-nav">
    <a href="encheres.html">Enchères en cours</a>
    <a href="vendre.html">Vendre un bateau</a>
    <a href="index.html#comment-ca-marche">Comment ça marche</a>
    <a href="#" class="btn btn--ghost" id="nav-login">Se connecter</a>
  </nav>
</header>

<div class="page-band">
  <p class="page-band__eyebrow">Toulon · Marseille · La Ciotat · Sète</p>
  <h1 class="page-band__title">Enchères en cours</h1>
</div>

<div class="search-row">
  <input type="search" id="search-input" placeholder="Rechercher un bateau, une marque, un port, une région...">
  <select id="sort-select">
    <option value="ending-soon">Clôture la plus proche</option>
    <option value="price-asc">Prix croissant</option>
    <option value="price-desc">Prix décroissant</option>
    <option value="proximity">Proximité (active la géolocalisation)</option>
  </select>
</div>

<div class="region-row">
  <select id="region-select">
    <option value="all">Toutes les régions</option>
    <option value="PACA">PACA</option>
    <option value="Occitanie">Occitanie</option>
    <option value="Corse">Corse</option>
  </select>
  <button type="button" class="btn btn--ghost" id="proximity-btn">📍 Trier par proximité</button>
  <span id="proximity-status"></span>
</div>

<div class="filters" role="group" aria-label="Filtrer par univers">
  <button class="chip" data-filter="all" aria-pressed="true">Tous les univers</button>
  <button class="chip" data-filter="voile">Voile</button>
  <button class="chip" data-filter="moteur">Moteur</button>
  <button class="chip" data-filter="semi-rigide">Semi-rigide</button>
  <button class="chip" data-filter="equipement">Équipement</button>
</div>

<main id="lots" class="lots-grid" aria-live="polite">
  <!-- rempli en JS, avec squelette de démo si Supabase n'est pas encore configuré -->
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
