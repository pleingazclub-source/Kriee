<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enchères en cours — Kriee</title>
<meta name="description" content="Recherche parmi les bateaux et équipements nautiques actuellement aux enchères dans le Sud de la France, par univers, région ou proximité.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .search-page {
    display: flex; align-items: flex-start; gap: 2rem;
    max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem;
  }
  .search-sidebar {
    width: 250px; flex-shrink: 0; position: sticky; top: 1.5rem;
    display: flex; flex-direction: column; gap: 1.6rem;
  }
  .search-sidebar__group label {
    display: block; font-family: var(--font-data); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.05em; color: #5A6772; margin-bottom: 0.5rem;
  }
  .search-sidebar input[type="search"] {
    width: 100%; padding: 0.65rem 0.8rem; border: 1px solid #C9C2B2; border-radius: var(--radius);
    font-family: var(--font-body); font-size: 0.9rem;
  }
  .search-sidebar select {
    width: 100%; padding: 0.6rem 0.7rem; border: 1px solid #C9C2B2; border-radius: var(--radius);
    font-family: var(--font-data); font-size: 0.8rem; background: var(--foam); color: var(--ink);
  }
  .filters--sidebar {
    display: flex; flex-direction: column; gap: 0.5rem; padding: 0;
  }
  .filters--sidebar .chip { text-align: left; border-radius: var(--radius); }
  #proximity-btn { width: 100%; justify-content: center; }
  #proximity-status { font-size: 0.75rem; color: #5A6772; display: block; margin-top: 0.5rem; }
  #reset-filters { background: none; border: none; color: var(--mistral); text-decoration: underline; font-size: 0.82rem; cursor: pointer; padding: 0; text-align: left; }

  .search-main { flex: 1; min-width: 0; }
  .search-main__toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; gap: 1rem; flex-wrap: wrap; }
  .search-main__count { font-size: 0.85rem; color: #5A6772; }
  #sort-select {
    padding: 0.6rem 0.8rem; border: 1px solid #C9C2B2; border-radius: var(--radius);
    font-family: var(--font-data); font-size: 0.8rem; background: var(--foam); color: var(--ink);
  }

  .lot-card__distance { font-family: var(--font-data); font-size: 0.7rem; color: var(--mistral); display: block; margin-top: 0.2rem; }

  @media (max-width: 860px) {
    .search-page { flex-direction: column; padding: 1.2rem; }
    .search-sidebar { width: 100%; position: static; }
  }
</style>
</head>
<body>

<div class="ticker" aria-label="Lots qui clôturent bientôt">
  <div class="ticker__track" id="ticker-track"></div>
</div>

<header class="site-header">
  <a href="index.html" class="brand">
    <svg class="brand__mark" width="24" height="26" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="5" y1="1" x2="5" y2="25" stroke="#0E2233" stroke-width="2"/>
      <path d="M5 3 L21 8.5 L5 14 Z" fill="#C7401F"/>
    </svg>
    <span class="brand__word">Kri<span style="color:var(--buoy)">ee</span></span>
    <span class="brand__sub">SUD DE LA FRANCE</span>
  </a>
  <nav class="site-nav">
    <a href="encheres.html">Enchères en cours</a>
    <a href="vendre.html" class="btn btn--primary">Déposer un lot</a>
    <a href="comment-ca-marche.html">Comment ça marche</a>
    <a href="#" class="btn btn--ghost" id="nav-login">Se connecter</a>

    <div class="user-menu" id="user-menu" style="display:none;">
      <button type="button" class="btn btn--ghost" id="user-menu-toggle">👤 <span id="user-menu-label"></span></button>
      <div class="user-menu__dropdown" id="user-menu-dropdown">
        <div class="user-menu__header">
          <strong id="user-menu-name"></strong>
          <span id="user-menu-email"></span>
        </div>
        <a href="compte.html">Mon profil</a>
        <a href="compte.html#activite">Mon activité<span class="tab-badge" id="user-menu-activite-badge" style="display:none;"></span></a>
        <a href="admin.html" id="user-menu-admin-link" style="display:none;">Modération</a>
        <button type="button" id="user-menu-logout">Se déconnecter</button>
      </div>
    </div>
  </nav>
</header>

<div class="page-band">
  <div class="page-band__inner">
  <p class="page-band__eyebrow">Toulon · Marseille · La Ciotat · Sète</p>
  <h1 class="page-band__title">Enchères en cours</h1>
  </div>
</div>

<div class="search-page">
  <aside class="search-sidebar">
    <div class="search-sidebar__group">
      <label for="search-input">Recherche</label>
      <input type="search" id="search-input" placeholder="Bateau, marque, port, région...">
    </div>

    <div class="search-sidebar__group">
      <label>Univers</label>
      <div class="filters filters--sidebar" role="group" aria-label="Filtrer par univers">
        <button class="chip" data-filter="all" aria-pressed="true">Tous les univers</button>
        <button class="chip" data-filter="voile">Voile</button>
        <button class="chip" data-filter="moteur">Moteur</button>
        <button class="chip" data-filter="semi-rigide">Semi-rigide</button>
        <button class="chip" data-filter="catamaran">Catamaran</button>
        <button class="chip" data-filter="jetski">Jet-ski</button>
        <button class="chip" data-filter="peche-travail">Pêche & travail</button>
        <button class="chip" data-filter="habitable">Péniche & habitable</button>
        <button class="chip" data-filter="remorque">Remorque</button>
        <button class="chip" data-filter="equipement">Équipement</button>
      </div>
    </div>

    <div class="search-sidebar__group">
      <label for="region-select">Région</label>
      <select id="region-select">
        <option value="all">Toutes les régions</option>
        <option value="PACA">PACA</option>
        <option value="Occitanie">Occitanie</option>
        <option value="Corse">Corse</option>
      </select>
    </div>

    <div class="search-sidebar__group">
      <label for="city-select">Ville</label>
      <select id="city-select">
        <option value="all">Toutes les villes</option>
      </select>
    </div>

    <div class="search-sidebar__group">
      <button type="button" class="btn btn--ghost" id="proximity-btn">📍 Trier par proximité</button>
      <span id="proximity-status"></span>
    </div>

    <button type="button" id="reset-filters">Réinitialiser les filtres</button>
  </aside>

  <main class="search-main">
    <div class="search-main__toolbar">
      <span class="search-main__count" id="results-count"></span>
      <select id="sort-select">
        <option value="ending-soon">Clôture la plus proche</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
        <option value="proximity">Proximité (active la géolocalisation)</option>
      </select>
    </div>

    <div id="lots" class="lots-grid" style="padding:0;" aria-live="polite">
      <!-- rempli en JS, avec squelette de démo si Supabase n'est pas encore configuré -->
    </div>
  </main>
</div>

<footer class="site-footer">
  <strong>Kriee</strong> — plateforme d'enchères nautiques entre particuliers.
  <div style="margin-top:0.8rem; font-size:0.78rem;"><a href="mentions-legales.html">Mentions légales</a> · <a href="confidentialite.html">Politique de confidentialité</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
